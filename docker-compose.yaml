name: streaming-writes-ib

x-spark-common: &spark-common
  image: apache/spark:4.1.3-scala2.13-java21-python3-ubuntu
  volumes:
    # Mount the folder, not the file: a file mount goes stale when an editor replaces it
    - ./conf/spark:/opt/spark/conf:ro
    - ./jobs:/opt/spark/jobs
  networks: [ lakehouse ]

x-lakekeeper-common: &lakekeeper-common
  image: quay.io/lakekeeper/catalog:v0.13.6
  environment:
    LAKEKEEPER__PG_ENCRYPTION_KEY: local-dev-only-not-secure
    LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
    LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
  networks: [ lakehouse ]

services:
  # ---------------------------------------------------------------------------
  # Object storage: Silo (community-maintained MinIO fork, S3 compatible)
  # ---------------------------------------------------------------------------
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: silo
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - silo-data:/data
    networks:
      lakehouse:
        aliases:
          - warehouse.silo

  # One-shot job that creates the Iceberg warehouse bucket
  silo-init:
    image: amazon/aws-cli:latest
    container_name: silo-init
    depends_on:
      - silo
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until aws --endpoint-url http://silo:9000 s3 ls >/dev/null 2>&1; do
          echo "waiting for silo..."; sleep 2;
        done
        aws --endpoint-url http://silo:9000 s3 mb s3://warehouse || true
        echo "bucket ready"
    networks: [ lakehouse ]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Catalog: Lakekeeper serving the Iceberg REST API at /catalog, backed by Postgres
  # ---------------------------------------------------------------------------
  catalog-db:
    image: postgres:17
    container_name: catalog-db
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper" ]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks: [ lakehouse ]

  # One-shot job that creates/upgrades Lakekeeper's database tables
  lakekeeper-migrate:
    <<: *lakekeeper-common
    container_name: lakekeeper-migrate
    command: [ "migrate" ]
    restart: "no"
    depends_on:
      catalog-db:
        condition: service_healthy

  lakekeeper:
    <<: *lakekeeper-common
    container_name: lakekeeper
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 3s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    ports:
      - "8181:8181" # Iceberg REST (http://localhost:8181/catalog) + UI

  # One-shot job: bootstrap Lakekeeper and create the "warehouse" warehouse on Silo
  lakekeeper-init:
    image: curlimages/curl:latest
    container_name: lakekeeper-init
    depends_on:
      lakekeeper:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    volumes:
      - ./conf/lakekeeper/create-warehouse.json:/tmp/create-warehouse.json:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        curl -s -X POST http://lakekeeper:8181/management/v1/bootstrap \
          -H 'Content-Type: application/json' -d '{"accept-terms-of-use": true}' -o /dev/null
        if curl -sf http://lakekeeper:8181/management/v1/warehouse | grep -q '"name":"warehouse"'; then
          echo "warehouse already exists"; exit 0
        fi
        code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST http://lakekeeper:8181/management/v1/warehouse \
          -H 'Content-Type: application/json' --data @/tmp/create-warehouse.json)
        case "$$code" in
          2*) echo "warehouse created" ;;
          *) echo "warehouse creation failed ($$code)"; cat /tmp/out; exit 1 ;;
        esac
    networks: [ lakehouse ]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Spark 4.1 standalone cluster: 1 master + 2 workers
  # ---------------------------------------------------------------------------
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    ports:
      - "7077:7077" # Spark master
      - "8080:8080" # Master web UI
      - "4040:4040" # Driver UI (for apps submitted from this container)

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"

  # ---------------------------------------------------------------------------
  # Query engine: single-node Trino (coordinator also acts as worker)
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:483
    container_name: trino
    hostname: trino
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    volumes:
      - ./conf/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    ports:
      - "8090:8080" # Trino UI / HTTP API (host 8080 is taken by the Spark master UI)
    networks: [ lakehouse ]

volumes:
  silo-data:
  catalog-db-data:

networks:
  lakehouse:
    name: lakehouse
