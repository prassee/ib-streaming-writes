spark.master                                   spark://spark-master:7077

# Iceberg runtime (must match the Spark minor version) + AWS bundle (S3FileIO)
# hadoop-aws (must match the image's Hadoop, 3.4.2) adds s3a:// for streaming
# checkpoints. It reuses the AWS SDK inside iceberg-aws-bundle (2.44.4) instead
# of pulling the 640MB SDK bundle; s3-transfer-manager is the one piece missing.
spark.jars.packages                            org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.apache.hadoop:hadoop-aws:3.4.2,software.amazon.awssdk:s3-transfer-manager:2.44.4
spark.jars.excludes                            software.amazon.awssdk:bundle,software.amazon.encryption.s3:amazon-s3-encryption-client-java
spark.jars.ivy                                 /tmp/.ivy2

# s3a:// on Silo (used for streaming checkpoints)
spark.hadoop.fs.s3a.endpoint                   http://silo:9000
spark.hadoop.fs.s3a.endpoint.region            us-east-1
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.access.key                 admin
spark.hadoop.fs.s3a.secret.key                 password

spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Lakekeeper via the Iceberg REST catalog API
spark.sql.catalog.iceberg                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                 rest
spark.sql.catalog.iceberg.uri                  http://lakekeeper:8181/catalog
spark.sql.catalog.iceberg.warehouse            warehouse
spark.sql.catalog.iceberg.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint          http://silo:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.s3.access-key-id     admin
spark.sql.catalog.iceberg.s3.secret-access-key password
spark.sql.catalog.iceberg.client.region        us-east-1

spark.sql.defaultCatalog                       iceberg
